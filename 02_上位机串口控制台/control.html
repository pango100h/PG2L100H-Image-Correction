<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FPGA 图像几何校正 · 串口控制台</title>
<style>
  :root{
    --bg:#0f1419; --panel:#161d26; --line:#243040;
    --txt:#e6edf3; --dim:#8b98a8; --acc:#3b82f6; --ok:#22c55e; --warn:#f59e0b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    padding:22px; min-height:100vh;
  }
  h1{font-size:19px; margin:0 0 4px; font-weight:600; letter-spacing:.5px;}
  .sub{color:var(--dim); font-size:12.5px; margin-bottom:18px;}
  .row{display:flex; gap:14px; align-items:center; flex-wrap:wrap;}
  .card{
    background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:16px 18px; margin-bottom:14px;
  }
  button{
    background:#1e2a38; color:var(--txt); border:1px solid var(--line);
    border-radius:7px; padding:8px 14px; font-size:13px; cursor:pointer;
    font-family:inherit; transition:.15s;
  }
  button:hover:not(:disabled){background:#26364a; border-color:#3a4d66;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  button.primary{background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600;}
  button.primary:hover:not(:disabled){background:#2f6fd8;}
  button.on{background:#14351f; border-color:var(--ok); color:var(--ok);}
  .dot{width:9px; height:9px; border-radius:50%; background:#4b5563; display:inline-block; margin-right:6px;}
  .dot.on{background:var(--ok); box-shadow:0 0 8px var(--ok);}
  .kv{color:var(--dim); font-size:12.5px;}
  .kv b{color:var(--txt); font-weight:600;}
  .slider-row{display:grid; grid-template-columns:96px 1fr 78px; gap:14px; align-items:center; margin:15px 0;}
  .slider-row label{font-size:13.5px; color:#c7d2de;}
  input[type=range]{
    -webkit-appearance:none; width:100%; height:5px; border-radius:3px;
    background:#233044; outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:17px; height:17px; border-radius:50%;
    background:var(--acc); cursor:pointer; border:2px solid #0f1419;
    box-shadow:0 0 0 1px var(--acc);
  }
  input[type=range]:disabled::-webkit-slider-thumb{background:#4b5563; box-shadow:none;}
  .val{
    font-family:Consolas,monospace; font-size:14px; text-align:right;
    color:var(--acc); font-weight:600;
  }
  .matrix{
    font-family:Consolas,monospace; font-size:12.5px; color:#9fb3c8;
    background:#0b1016; border:1px solid var(--line); border-radius:7px;
    padding:10px 12px; line-height:1.55; word-break:break-all;
  }
  #log{
    font-family:Consolas,monospace; font-size:11.5px; color:#7d8b9c;
    height:88px; overflow-y:auto; background:#0b1016;
    border:1px solid var(--line); border-radius:7px; padding:8px 10px;
  }
  #log div{margin-bottom:1px;}
  .warn{color:var(--warn);}
  .grp-title{font-size:12px; color:var(--dim); margin-bottom:9px; letter-spacing:.5px;}
  .hint{color:var(--dim); font-size:12px; line-height:1.7; margin-top:10px;}
</style>
</head>
<body>

<h1>FPGA 图像几何校正 · 串口控制台</h1>
<div class="sub">高阶任务 1 —— 上位机指令实时下发参数　|　115200 8N1　|　PG2L100H-6IFBG676</div>

<div class="card">
  <div class="row">
    <button id="btnConn" class="primary">连接串口</button>
    <span class="kv"><span class="dot" id="dot"></span><span id="portName">未连接</span></span>
    <span style="flex:1"></span>
    <span class="kv">指令回显 <b id="echoCnt">0</b> 字节</span>
  </div>
</div>

<div class="card">
  <div class="grp-title">仿射变换参数</div>

  <div class="slider-row">
    <label>旋转角度</label>
    <input type="range" id="rot" min="-45" max="45" value="0" step="1" disabled>
    <div class="val" id="rotV">0°</div>
  </div>

  <div class="slider-row">
    <label>缩放</label>
    <input type="range" id="zoom" min="50" max="200" value="100" step="1" disabled>
    <div class="val" id="zoomV">100%</div>
  </div>

  <div class="slider-row">
    <label>剪切</label>
    <input type="range" id="shear" min="-100" max="100" value="0" step="1" disabled>
    <div class="val" id="shearV">0</div>
  </div>

  <div class="matrix" id="mtx">A ——　B ——　C ——　D ——</div>
</div>

<div class="card">
  <div class="grp-title">预设与 Gamma</div>
  <div class="row" style="margin-bottom:12px;">
    <button class="preset" data-m="0" disabled>M0 恒等</button>
    <button class="preset" data-m="1" disabled>M1 旋转 8°</button>
    <button class="preset" data-m="2" disabled>M2 剪切</button>
    <button class="preset" data-m="3" disabled>M3 旋转+放大</button>
  </div>
  <div class="row">
    <button class="gam" data-g="0" disabled>γ 0.55</button>
    <button class="gam" data-g="1" disabled>γ 0.78</button>
    <button class="gam" data-g="2" disabled>γ 1.00</button>
    <button class="gam" data-g="3" disabled>γ 1.45</button>
    <button class="gam" data-g="4" disabled>自动选档</button>
  </div>
  <div class="hint">
    拖动滑块时参数实时下发到 FPGA，右半屏画面立即响应。<br>
    左半屏始终是未经处理的原始图像，用于对照。
  </div>
</div>

<div class="card">
  <div class="grp-title">通信日志</div>
  <div id="log"><div>等待连接…</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
let port = null, writer = null, reader = null, connected = false;
let echoBytes = 0;

function log(msg, cls){
  const el = $('log');
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  el.appendChild(d);
  while (el.children.length > 120) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

/* ---------- 连接 ---------- */
$('btnConn').onclick = async () => {
  if (connected) { await disconnect(); return; }
  if (!('serial' in navigator)) {
    log('此浏览器不支持 Web Serial，请用 Edge 或 Chrome 打开', 'warn');
    return;
  }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200, dataBits: 8, stopBits: 1, parity: 'none' });
    writer = port.writable.getWriter();
    connected = true;
    $('dot').classList.add('on');
    $('portName').textContent = '已连接 · 115200 8N1';
    $('btnConn').textContent = '断开';
    $('btnConn').classList.remove('primary');
    document.querySelectorAll('input[type=range], .preset, .gam').forEach(e => e.disabled = false);
    log('串口已打开，等待 FPGA 回显…');
    readLoop();
    setTimeout(() => sendImmediate('M0'), 200);
  } catch (e) {
    log('连接失败：' + e.message, 'warn');
  }
};

async function disconnect(){
  try {
    connected = false;
    if (reader) { await reader.cancel().catch(()=>{}); reader = null; }
    if (writer) { writer.releaseLock(); writer = null; }
    if (port) { await port.close(); port = null; }
  } catch(e){}
  $('dot').classList.remove('on');
  $('portName').textContent = '未连接';
  $('btnConn').textContent = '连接串口';
  $('btnConn').classList.add('primary');
  document.querySelectorAll('input[type=range], .preset, .gam').forEach(e => e.disabled = true);
  log('串口已关闭');
}

async function readLoop(){
  while (connected && port && port.readable) {
    try {
      reader = port.readable.getReader();
      while (connected) {
        const { value, done } = await reader.read();
        if (done) break;
        if (value) { echoBytes += value.length; $('echoCnt').textContent = echoBytes; }
      }
    } catch(e) { break; }
    finally { if (reader) { reader.releaseLock(); reader = null; } }
  }
}

/* ---------- 发送（节流，避免拖动时刷爆串口） ---------- */
let pendingCmd = null, sending = false;

function sendImmediate(str){
  pendingCmd = str;
  drain();
}

async function drain(){
  if (sending) return;
  sending = true;
  while (pendingCmd && writer) {
    const s = pendingCmd;
    pendingCmd = null;
    try {
      await writer.write(new TextEncoder().encode(s));
      log('→ ' + s);
    } catch(e) {
      log('发送失败：' + e.message, 'warn');
    }
    await new Promise(r => setTimeout(r, 55));
  }
  sending = false;
}

/* ---------- 矩阵计算 ---------- */
/* M = s · R(θ) · Shear(k)  →  Q12 定点，1.0 = 4096 */
function buildMatrix(){
  const deg   = +$('rot').value;
  const zoom  = +$('zoom').value / 100;
  const shear = +$('shear').value / 100;
  const rad = deg * Math.PI / 180;
  const cos = Math.cos(rad), sin = Math.sin(rad);

  const a = zoom * cos;
  const b = zoom * (cos * shear - sin);
  const c = zoom * sin;
  const d = zoom * (sin * shear + cos);

  const q = v => (Math.round(v * 4096) & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
  const hex = q(a) + q(b) + q(c) + q(d) + '0000' + '0000';

  $('mtx').textContent =
    `A ${a.toFixed(3).padStart(7)}　B ${b.toFixed(3).padStart(7)}　` +
    `C ${c.toFixed(3).padStart(7)}　D ${d.toFixed(3).padStart(7)}` +
    `　→　S${hex}`;

  return 'S' + hex;
}

function onSlide(){
  $('rotV').textContent   = $('rot').value + '°';
  $('zoomV').textContent  = $('zoom').value + '%';
  $('shearV').textContent = $('shear').value;
  if (connected) sendImmediate(buildMatrix());
}

['rot','zoom','shear'].forEach(id => {
  $(id).addEventListener('input', onSlide);
});

document.querySelectorAll('.preset').forEach(btn => {
  btn.onclick = () => {
    const m = btn.dataset.m;
    sendImmediate('M' + m);
    document.querySelectorAll('.preset').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    if (m === '0') { $('rot').value = 0; $('zoom').value = 100; $('shear').value = 0; onSlide(); }
  };
});

document.querySelectorAll('.gam').forEach(btn => {
  btn.onclick = () => {
    sendImmediate('G' + btn.dataset.g);
    document.querySelectorAll('.gam').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
  };
});

onSlide();
buildMatrix();
</script>
</body>
</html>
